<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ME — A Little World</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="intro">

    <!-- BACKGROUND -->
    <div class="background"></div>

    <!-- PINK ATMOSPHERE -->
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <!-- PARTICLES -->
    <div class="particles"></div>


    <!-- TOP TEXT -->
    <div class="top-label">
        <span>ONE MORE LITTLE WORLD</span>
    </div>


    <!-- CENTER -->
    <section class="center">

        <div class="emblem" id="emblem">

            <div class="emblem-glow"></div>

            <!-- ROTATING RINGS -->
            <div class="ring ring-one"></div>
            <div class="ring ring-two"></div>

            <!-- DIAMOND -->
            <div class="diamond">

                <!-- top crown -->
                <div class="diamond-top"></div>

                <!-- left facet -->
                <div class="facet facet-left"></div>

                <!-- center facet -->
                <div class="facet facet-center"></div>

                <!-- right facet -->
                <div class="facet facet-right"></div>

                <!-- bottom facets -->
                <div class="facet facet-bottom-left"></div>
                <div class="facet facet-bottom-right"></div>

                <!-- shine -->
                <div class="diamond-shine"></div>

                <!-- text -->
                <div class="diamond-content">
                    <h1>ME</h1>
                    <span>A LITTLE PART<br>OF THIS STORY</span>
                </div>

            </div>

        </div>


        <!-- INTRO TEXT -->
        <div class="intro-content">

            <p id="message">
                There is one more little world waiting.
            </p>

            <button id="enterBtn">
                <span>ENTER</span>
                <i>→</i>
            </button>

        </div>

    </section>


    <!-- BOTTOM -->
    <div class="bottom-label">
        <span>CLICK TO DISCOVER</span>
    </div>

</main>


<script src="SCRIPT.js"></script>

</body>
</html>
